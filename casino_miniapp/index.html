<html lang="ru">

<title>Glint Mini App</title>
<meta name="theme-color" content="#0d0d10">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap");
:root {
  color-scheme: dark;
  --bg: #0d0d10;
  --bg-grid: rgba(255,255,255,0.035);
  --surface-1: #131317;
  --surface-2: #1a1a1f;
  --surface-3: #26262c;
  --surface-4: #3a3a42;
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.16);
  --ink: #ffffff;
  --ink-muted: #9b9ba3;
  --ink-faint: #6b6b73;
  --accent: #0b72e7;
  --on-accent: #ffffff;
  --ball: #2bb8e6;
  --ball-hi: #8be6ff;
  --ball-lo: #0b6f99;
  --on-ball: #062a3b;
  --teal: #1f7a8a;
  --teal-deep: #155e68;
  --teal-soft: #d6f4f8;
  --game-blue: #1e3fd8;
  --game-violet: #6d28d9;
  --game-green: #17802c;
  --win: #2fd566;
  --loss: #ff4d62;
  --focus: #3fc8f2;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;
  --shadow-ball: inset -6px -8px 14px rgba(0,40,60,0.45), inset 4px 6px 10px rgba(255,255,255,0.35), 0 6px 18px rgba(43,184,230,0.25);
  --shadow-card: 0 10px 30px rgba(0,0,0,0.45);
  --shadow-glass: inset 0 1px 0 rgba(255,255,255,0.08);
  --font-sans: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { overscroll-behavior: none; }
#root { height: 100vh; height: 100dvh; height: var(--tg-viewport-stable-height, 100dvh); }

/* ---------- base ---------- */
body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
.gl-grid-bg { background-color: var(--bg); background-image: linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px); background-size: 24px 24px; }
.gl-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; padding: var(--space-4); }
.gl-col { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); }
.gl-btn-reset { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.gl-btn-reset:focus-visible, .gl-focus:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.gl-icon { display: inline-block; flex: none; vertical-align: middle; }
.gl-muted { color: var(--ink-muted); }

/* ---------- currency ---------- */
.gl-coin { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: var(--bg); }
.gl-coin-sm { width: 16px; height: 16px; border-radius: 5px; }
.gl-coin-bare { background: none; color: inherit; width: auto; height: auto; }
.gl-amount { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gl-amount-win { color: var(--win); }
.gl-amount-loss { color: var(--loss); }

/* ---------- header ---------- */
.gl-balance { display: inline-flex; align-items: center; gap: var(--space-2); height: 48px; padding: 0 6px 0 12px; border-radius: var(--radius-md); background: var(--surface-3); border: 1px solid var(--line); box-shadow: var(--shadow-glass); font-weight: 700; font-size: 15px; }
.gl-balance-plus { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--surface-4); }
.gl-iconbtn { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--surface-3); border: 1px solid var(--line); box-shadow: var(--shadow-glass); color: var(--ink); }
.gl-iconbtn:active, .gl-balance-plus:active { background: var(--surface-4); }
.gl-iconbtn[aria-pressed="true"] { border-color: var(--line-strong); }
.gl-topbar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); }

/* ---------- badges ---------- */
.gl-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 6px; background: var(--surface-4); color: var(--ink-muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.gl-badge-new { background: var(--ball-hi); color: var(--on-ball); transform: rotate(-4deg); font-size: 12px; height: 22px; padding: 0 10px; }
.gl-online { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink); }
.gl-online::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--win); box-shadow: 0 0 0 3px rgba(47,213,102,.18); }

/* ---------- game round ---------- */
.gl-pool { text-align: center; padding: var(--space-6) var(--space-4) var(--space-4); position: relative; }
.gl-pool-label { font-size: 16px; line-height: 20px; font-weight: 600; color: var(--ink-muted); }
.gl-pool-amount { font-size: 44px; line-height: 48px; font-weight: 800; letter-spacing: -.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.gl-pool-meta { display: inline-flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.gl-pool-meta i { width: 1px; height: 12px; background: var(--line-strong); }
.gl-spot { position: relative; }
.gl-spot::before { content: ""; position: absolute; inset: -40px -20px auto; height: 220px; pointer-events: none; background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.10), transparent 65%); }

.gl-player { display: flex; align-items: center; gap: var(--space-3); padding: 10px 14px 10px 10px; border-radius: var(--radius-md); background: var(--surface-3); border: 1px solid var(--line); box-shadow: var(--shadow-glass); position: relative; overflow: hidden; }
.gl-player-share { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(43,184,230,.10); pointer-events: none; }
.gl-player-win { border-color: var(--win); }
.gl-avatar { width: 48px; height: 48px; border-radius: var(--radius-sm); flex: none; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: var(--ink); background: var(--surface-4); object-fit: cover; position: relative; }
.gl-avatar-sm { width: 40px; height: 40px; border-radius: 999px; font-size: 15px; }
.gl-player-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
.gl-player-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gl-player-stake { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; position: relative; }

.gl-status { flex: 1; min-width: 0; text-align: center; padding: 12px var(--space-3); border-radius: var(--radius-lg); background: var(--surface-2); border: 1px solid var(--line); }
.gl-status-label { font-size: 13px; line-height: 16px; font-weight: 600; color: var(--ink-muted); }
.gl-status-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 26px; line-height: 30px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

.gl-action { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.gl-action-face { width: 64px; height: 64px; display: grid; place-items: center; border-radius: var(--radius-lg); background: linear-gradient(160deg, var(--teal), var(--teal-deep)); border: 1px solid var(--line-strong); color: var(--ink); box-shadow: var(--shadow-glass); }
.gl-action-quiet .gl-action-face { background: var(--surface-2); border-color: var(--line); }
.gl-action:disabled { cursor: not-allowed; }
.gl-action:disabled .gl-action-face { opacity: .45; }
.gl-switch { display: inline-flex; gap: 2px; padding: 4px; border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--line); }
.gl-switch button { width: 32px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-faint); }
.gl-switch button[aria-pressed="true"] { background: var(--surface-4); color: var(--ink); }

.gl-rail { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); padding: 0 var(--space-3); }
.gl-bet { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; }
.gl-ball { width: 60px; height: 60px; border-radius: 999px; display: grid; place-items: center; font-size: 22px; line-height: 1; font-weight: 500; color: var(--on-ball); background: radial-gradient(circle at 32% 28%, var(--ball-hi) 0%, var(--ball) 45%, var(--ball-lo) 100%); box-shadow: var(--shadow-ball); transition: transform .15s ease, width .15s ease, height .15s ease; }
.gl-bet[aria-pressed="true"] .gl-ball { width: 72px; height: 72px; font-size: 28px; }
.gl-bet:active .gl-ball { transform: scale(.94); }
.gl-bet-price { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 2px; }
.gl-bet[aria-pressed="true"] .gl-bet-price { color: var(--ink); }

/* ---------- navigation ---------- */
.gl-nav { display: flex; background: var(--surface-1); border-top: 1px solid var(--line); padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
.gl-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink-muted); padding: 4px 0; border-radius: 12px; }
.gl-nav-item .gl-icon { color: var(--ink-faint); }
.gl-nav-item[aria-current="page"] { color: var(--ink); }
.gl-nav-item[aria-current="page"] .gl-icon { color: var(--ink); }

.gl-tabs { display: flex; gap: var(--space-6); padding: 0 var(--space-5); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.gl-tab { padding: 16px 0 14px; font-size: 15px; font-weight: 600; color: var(--ink-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.gl-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.gl-select { position: relative; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 48px; padding: 0 12px 0 14px; border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--line); font-size: 15px; font-weight: 600; flex: 1 1 0; min-width: 0; }
.gl-select select { position: absolute; inset: 0; opacity: 0; cursor: pointer; font: inherit; }
.gl-select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gl-select:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.gl-filters { display: flex; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-3); }

/* ---------- shop ---------- */
.gl-gifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); padding: 0 var(--space-4) var(--space-4); }
.gl-gift { display: flex; flex-direction: column; border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; padding: 6px 6px 8px; gap: 6px; }
.gl-gift-art { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; overflow: hidden; }
.gl-gift-art img, .gl-gift-art svg { width: 78%; height: 78%; }
.gl-gift-name { font-size: 13px; line-height: 16px; font-weight: 700; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gl-gift-num { font-size: 11px; line-height: 14px; color: var(--ink-muted); padding: 0 2px; margin-top: -4px; }
.gl-price { display: flex; align-items: center; justify-content: center; gap: 4px; height: 34px; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.gl-price:disabled { opacity: .5; cursor: not-allowed; }
.gl-price-owned { background: var(--surface-4); color: var(--ink); }

/* ---------- lobby ---------- */
.gl-game { position: relative; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; border-radius: var(--radius-lg); overflow: hidden; padding: var(--space-4); min-height: 150px; color: var(--ink); border: 1px solid var(--line-strong); box-shadow: var(--shadow-card); }
.gl-game-blue { background: var(--game-blue); }
.gl-game-violet { background: var(--game-violet); }
.gl-game-green { background: var(--game-green); }
.gl-game-art { position: absolute; inset: 0; pointer-events: none; }
.gl-game-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.35) 100%); }
.gl-game-top { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }
.gl-game-title { position: relative; font-size: 26px; line-height: 30px; font-weight: 700; }
.gl-game-sub { position: relative; font-size: 13px; line-height: 16px; font-weight: 500; margin-top: 2px; }
.gl-game-center { align-items: center; text-align: center; }
.gl-lobby { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); padding: 0 var(--space-4) var(--space-4); }
.gl-lobby > .gl-wide { grid-column: 1 / -1; }
.gl-lobby > .gl-tall { grid-row: span 2; }
.gl-page-title { font-size: 40px; line-height: 44px; font-weight: 700; padding: var(--space-5) var(--space-5) var(--space-4); margin: 0; }

/* ---------- profile ---------- */
.gl-hero { background: linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%); padding: var(--space-6) var(--space-4) 56px; text-align: center; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%); background-size: 24px 24px, 24px 24px, auto; }
.gl-hero-label { font-size: 16px; font-weight: 600; color: var(--teal-soft); }
.gl-hero-amount { display: inline-flex; align-items: center; gap: 10px; font-size: 44px; line-height: 48px; font-weight: 800; margin-top: 2px; }
.gl-hero-actions { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-5); }
.gl-hero-actions .gl-action { flex: 1; max-width: 108px; text-align: center; }
.gl-hero-actions .gl-action-face { width: 100%; height: 48px; border-radius: 999px; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); }
.gl-sheet { position: relative; margin-top: -32px; background: var(--surface-1); border-radius: var(--radius-xl) var(--radius-xl) 0 0; border-top: 1px solid var(--line); }
.gl-me { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-3); }
.gl-me-name { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.gl-inv { margin: 0 var(--space-3) var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-2); border: 1px solid var(--line); }
.gl-inv-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
.gl-inv-title { font-size: 20px; line-height: 24px; font-weight: 700; }
.gl-inv-count { font-size: 13px; font-weight: 600; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 4px; }
.gl-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); margin-top: var(--space-4); }
.gl-slot { aspect-ratio: 1; border-radius: var(--radius-md); background: var(--surface-3); display: grid; place-items: center; color: var(--ink-faint); overflow: hidden; }
.gl-slot-all { color: var(--ink); font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.gl-hint { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); margin-top: var(--space-3); padding: 12px 14px; border-radius: var(--radius-md); background: var(--teal-deep); font-size: 13px; font-weight: 600; color: var(--teal-soft); }
.gl-hint button { color: var(--teal-soft); display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }

/* ---------- shell ---------- */
.gl-app { width: 100%; max-width: 420px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.gl-app-body { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.gl-shophead { background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%); background-size: 24px 24px, 24px 24px, auto; padding: var(--space-5) var(--space-4) 52px; display: flex; justify-content: space-between; align-items: center; }
.gl-shophead h1 { margin: 0; font-size: 40px; line-height: 44px; font-weight: 700; }
.gl-toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--surface-4); border: 1px solid var(--line-strong); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow-card); z-index: 5; }
.gl-back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-muted); font-weight: 600; font-size: 14px; }
.gl-demo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); text-align: center; padding: 4px 0 0; }
@media (prefers-reduced-motion: reduce) { .gl-ball { transition: none; } }

</style>
