# Настройки ИИ-продавца. Меняй под себя — бот берёт всё отсюда.

company:
  name: "Байт & Борщ"
  name_latin: "ByteBorsch Studio"
  tagline: "Робимо сайти, які продають"
  manager_name: "Тимур"           # кому передаём тёплого клиента
  contact: "Telegram @byteborsch"  # как с вами связаться (замени на свой)

# Бот представляется так (он всегда честно говорит, что он ИИ-асистент).
assistant_name: "Софія"

# Прайс. Бот называет только эти цены и не выдумывает свои.
# segment — кому звоним; бот сам выбирает подходящий пакет.
pricing:
  - name: "Сайт-візитка"
    price: "від 150 $"
    term: "3–5 днів"
    for: "самозайняті, майстри, репетитори, салони краси"
  - name: "Лендинг під рекламу"
    price: "від 250 $"
    term: "5–7 днів"
    for: "малий бізнес, одна послуга або товар, запуск реклами"
  - name: "Корпоративний сайт"
    price: "від 500 $"
    term: "2–3 тижні"
    for: "компанії, клініки, будівельники, юристи, автосервіси"
  - name: "Інтернет-магазин"
    price: "від 800 $"
    term: "3–5 тижнів"
    for: "магазини, виробники, ті, хто продає в Instagram або OLX"

extras:
  - "Підтримка сайту — від 30 $/міс"
  - "Налаштування реклами Google / Meta — окремо, за домовленістю"
  - "Перша консультація та прототип головної сторінки — безкоштовно"

# Цель звонка: договориться о бесплатной консультации с менеджером.
goal: "домовитися про безкоштовну 15-хвилинну консультацію з менеджером (дзвінок або Telegram) у зручний для клієнта час"

# ---------- Нейросеть ----------
# gemini     — БЕСПЛАТНО (лимит запросов в день), лучше всех из бесплатных говорит по-украински
# groq       — БЕСПЛАТНО (лимит), очень быстрые ответы
# openrouter — есть бесплатные модели (с ":free" в названии), но они медленнее и нестабильнее
# claude     — платно (~$0.03–0.05 за звонок на Haiku), самое качественное
provider: "gemini"

providers:
  gemini:     # ключ: https://aistudio.google.com/apikey
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: "gemini-3.6-flash"     # актуальные названия смотри в AI Studio
    reasoning_effort: "minimal"   # быстрее отвечает; если модель ругается на это — поставь "low"
    key_env: "GEMINI_API_KEY"
  groq:       # ключ: https://console.groq.com/keys
    base_url: "https://api.groq.com/openai/v1"
    model: "llama-3.3-70b-versatile"   # список: https://console.groq.com/docs/models
    key_env: "GROQ_API_KEY"
  openrouter: # ключ: https://openrouter.ai/keys
    base_url: "https://openrouter.ai/api/v1"
    model: "meta-llama/llama-3.3-70b-instruct:free"   # бесплатные: https://openrouter.ai/models?q=free
    key_env: "OPENROUTER_API_KEY"
  claude:     # ключ: https://console.anthropic.com (переменная ANTHROPIC_API_KEY)
    model: "claude-haiku-4-5"   # или claude-sonnet-5 / claude-opus-5 — умнее, но дороже
    effort: "low"               # только для sonnet/opus
