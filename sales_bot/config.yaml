# Настройки ИИ-продавца. Меняй под себя — бот берёт всё отсюда.

company:
  name: "Байт & Борщ"
  name_latin: "ByteBorsch Studio"
  tagline: "Робимо сайти, які продають"
  manager_name: "Тимур"           # кому передаём тёплого клиента
  contact: "Telegram @byteborsch"  # как с вами связаться (замени на свой)

# Бот представляется так (он всегда честно говорит, что он ИИ-асистент).
assistant_name: "Софія"

# Прайс. Бот называет только эти цены и не выдумывает свои.
# segment — кому звоним; бот сам выбирает подходящий пакет.
pricing:
  - name: "Сайт-візитка"
    price: "від 150 $"
    term: "3–5 днів"
    for: "самозайняті, майстри, репетитори, салони краси"
  - name: "Лендинг під рекламу"
    price: "від 250 $"
    term: "5–7 днів"
    for: "малий бізнес, одна послуга або товар, запуск реклами"
  - name: "Корпоративний сайт"
    price: "від 500 $"
    term: "2–3 тижні"
    for: "компанії, клініки, будівельники, юристи, автосервіси"
  - name: "Інтернет-магазин"
    price: "від 800 $"
    term: "3–5 тижнів"
    for: "магазини, виробники, ті, хто продає в Instagram або OLX"

extras:
  - "Підтримка сайту — від 30 $/міс"
  - "Налаштування реклами Google / Meta — окремо, за домовленістю"
  - "Перша консультація та прототип головної сторінки — безкоштовно"

# Цель звонка: договориться о бесплатной консультации с менеджером.
goal: "домовитися про безкоштовну 15-хвилинну консультацію з менеджером (дзвінок або Telegram) у зручний для клієнта час"

# Модель — главное, от чего зависит цена (примерно за один звонок ~10 реплик):
#   claude-haiku-4-5  — самая дешёвая и быстрая, ~$0.03–0.05 за звонок (по умолчанию)
#   claude-sonnet-5   — умнее, ~$0.07–0.12 за звонок
#   claude-opus-5     — самая умная, ~$0.15–0.30 за звонок
model: "claude-haiku-4-5"
# Только для sonnet/opus: low — быстрее (важно для голоса), medium/high — умнее, но дольше пауза.
effort: "low"
